name: dukaantak_customer
description: DukaanTak Customer App - Aapke Bazaar Se Aapke Ghar Tak
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: ^6.2.2
  provider: any
  geolocator: any
  url_launcher: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Launcher icon - generated by: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0034E1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
