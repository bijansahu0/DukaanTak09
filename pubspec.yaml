name: dukaantak_customer
description: DukaanTak Customer App - Aapke Bazaar Se Aapke Ghar Tak
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pinned versions (pehle 'any' tha, jo har build pe latest version kheench kar
  # Gradle/AGP mismatch aur lintVitalAnalyzeRelease error de sakta tha)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2
  provider: ^6.1.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

# Launcher icon - generated by: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0034E1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
