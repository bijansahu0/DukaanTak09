workflows:
  customer-apk:
    name: DukaanTak Customer APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project (flatten files, Firebase, permissions)
        script: bash ci_setup.sh
      - name: Disable Gradle lint tasks (all plugins + app)
        script: |
          mkdir -p $HOME/.gradle/init.d
          cat > $HOME/.gradle/init.d/disable-lint.gradle <<'EOF'
          allprojects {
              tasks.configureEach { task ->
                  def n = task.name
                  if (n == "lint" || n.startsWith("lintVital") || n.startsWith("lintAnalyze")
                          || n.startsWith("lintReport") || n.startsWith("lintFix")) {
                      task.enabled = false
                  }
              }
          }
          EOF
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G" >> android/gradle.properties
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
